<!doctype html>
<html lang="lt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="reader.css?v=continuous-scroll-20260913">
  <title>Skaityklė</title>
</head>
<body>
  <header class="topbar" id="topbar">
    <a class="home-link" href="index.html" aria-label="Grįžti į lentyną">←</a>
    <select class="chapter-select" id="chapterSelect" aria-label="Skyrius"></select>
    <button class="control-button chapter-play-button" id="chapterPlayButton" type="button" aria-label="Klausyti skyriaus" aria-pressed="false" disabled>
      <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
        <path class="audio-icon-play" d="M4 2 14 8 4 14Z"/>
        <path class="audio-icon-pause" d="M3 2h4v12H3zM9 2h4v12H9z"/>
      </svg>
    </button>
    <div class="controls" aria-label="Skaitymo nustatymai">
      <button class="control-button theme-button" id="themeButton" type="button">🌙</button>
      <button class="control-button" id="fontDownButton" type="button">A-</button>
      <button class="control-button" id="fontUpButton" type="button">A+</button>
      <button class="control-button family-button" id="familyButton" type="button">A</button>
    </div>
  </header>
  <div class="chapter-audio-error" id="chapterAudioError" role="status" hidden>Nepavyko paleisti. Bandyk dar kartą.</div>

  <main class="reader">
    <article class="content" id="content" aria-label="Adaptuotas tekstas">
      <p class="loading">Kraunama...</p>
    </article>
  </main>

  <footer class="progress-bar" aria-label="Skaitymo pažanga">
    <span>Knyga <span id="progressText">0%</span> · <span id="chapterCountText"></span></span>
    <span>Skyrius <span id="chapterProgressText">0%</span></span>
  </footer>

  <div class="tooltip" id="tooltip" role="note" hidden>
    <div class="tooltip-note" id="tooltipNote"></div>
    <div class="tooltip-audio-error" id="tooltipAudioError" role="status" hidden>Nepavyko paleisti. Bandyk dar kartą.</div>
    <div class="tooltip-footer">
      <div class="tooltip-translation" id="tooltipTranslation"></div>
      <button class="tooltip-audio-button" id="tooltipAudioButton" type="button" aria-pressed="false" hidden>
        <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
          <path class="audio-icon-play" d="M4 2 14 8 4 14Z"/>
          <rect class="audio-icon-stop" x="2" y="2" width="12" height="12"/>
        </svg>
        <span>Klausyti</span>
      </button>
    </div>
  </div>
  <audio id="phraseAudio" preload="none" hidden></audio>
  <audio id="chapterAudio" preload="none" hidden></audio>

  <script src="reader.js?v=continuous-scroll-20260913" defer></script>
</body>
</html>
